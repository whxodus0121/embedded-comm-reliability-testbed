<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>CASE 02 | BEFORE</title>
<rect width="1200" height="720" fill="#f4f7fb"/>
<text x="40" y="48" fill="#14243a" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">CASE 02 | BEFORE</text>
<rect x="70" y="92" width="1060" height="58" rx="12" fill="white" stroke="#d8e2ed"/>
<text x="600" y="128" fill="#14243a" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle">Partial frame + EOF</text>
<line x1="600" y1="151" x2="600" y2="169" stroke="#1769aa" stroke-width="2"/>
<rect x="70" y="170" width="1060" height="58" rx="12" fill="white" stroke="#d8e2ed"/>
<text x="600" y="206" fill="#14243a" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle">runtime_error escapes connection handler</text>
<line x1="600" y1="229" x2="600" y2="247" stroke="#1769aa" stroke-width="2"/>
<rect x="70" y="248" width="1060" height="58" rx="12" fill="white" stroke="#d8e2ed"/>
<text x="600" y="284" fill="#14243a" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle">main catch: Receiver exit 1</text>
<line x1="600" y1="307" x2="600" y2="325" stroke="#1769aa" stroke-width="2"/>
<rect x="70" y="326" width="1060" height="58" rx="12" fill="white" stroke="#d8e2ed"/>
<text x="600" y="362" fill="#14243a" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle">Next connection refused</text>
<text x="70" y="440" fill="#14243a" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Boundary</text>
<text x="570" y="440" fill="#14243a" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Survived</text>
<text x="835" y="440" fill="#14243a" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Follow-up ACK</text>
<text x="70" y="483" fill="#14243a" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">header-zero</text>
<text x="570" y="483" fill="#14243a" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">3/3</text>
<text x="835" y="483" fill="#14243a" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">3/3</text>
<text x="70" y="531" fill="#14243a" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">header-partial</text>
<text x="570" y="531" fill="#14243a" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">0/3</text>
<text x="835" y="531" fill="#14243a" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">0/3</text>
<text x="70" y="579" fill="#14243a" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">payload-zero</text>
<text x="570" y="579" fill="#14243a" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">3/3</text>
<text x="835" y="579" fill="#14243a" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">3/3</text>
<text x="70" y="627" fill="#14243a" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">payload-partial</text>
<text x="570" y="627" fill="#14243a" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">0/3</text>
<text x="835" y="627" fill="#14243a" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">0/3</text>
<text x="70" y="695" fill="#52657a" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Incomplete frames were not processed or acknowledged; same-sequence follow-up tested.</text>
</svg>
